name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Clone pinned scientific snapshots read-only
        run: |
          mkdir -p .sources/snapshots
          for commit in \
            63c235c2961392e1816d0fee9393dbadc7259790 \
            8ac0700e97baf51c4585bed7c4a3497dcb57fdac \
            a560bb771a8ccaf92958bde8e72280e2c968825f \
            06523c8d9ff6d0f4e66457997f5094b69065ec95
          do
            git clone --quiet --filter=blob:none --no-checkout \
              https://github.com/yoheinakajima/distributed-discovery.git \
              ".sources/snapshots/$commit"
            git -C ".sources/snapshots/$commit" checkout --quiet --detach "$commit"
            test "$(git -C ".sources/snapshots/$commit" rev-parse HEAD)" = "$commit"
            test -z "$(git -C ".sources/snapshots/$commit" status --porcelain)"
          done
      - name: Clone pinned DD-022 holdout read-only
        run: |
          commit=504c9fb9c1039b21bf57f83a794f9f0da3e64afa
          mkdir -p .sources/holdout
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/yoheinakajima/distributed-discovery.git \
            ".sources/holdout/$commit"
          git -C ".sources/holdout/$commit" checkout --quiet --detach "$commit"
          test "$(git -C ".sources/holdout/$commit" rev-parse HEAD)" = "$commit"
          test -z "$(git -C ".sources/holdout/$commit" status --porcelain)"
      - run: uv sync --frozen --extra dev
      - run: make check
        env:
          DD_SOURCE: .sources/snapshots/a560bb771a8ccaf92958bde8e72280e2c968825f
          DD_SNAPSHOT_ROOT: .sources/snapshots
          DD_HOLDOUT_SOURCE: .sources/holdout/504c9fb9c1039b21bf57f83a794f9f0da3e64afa
